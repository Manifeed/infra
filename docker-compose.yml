services:
  postgres:
    image: postgres:15
    container_name: manifeed_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-manifeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manifeed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manifeed} -d ${POSTGRES_ADMIN_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manifeed_internal
    ports:
      - 5432:5432

  redis:
    image: redis/redis-stack-server:latest
    container_name: manifeed_redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manifeed_internal

  qdrant:
    image: qdrant/qdrant:latest
    container_name: manifeed_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - manifeed_internal
    ports:
      - 6333:6333

  db_migrations:
    image: manifeed_db_migrations:local
    build:
      context: ./postgres_migration
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    environment:
      POSTGRES_ADMIN_DATABASE: ${POSTGRES_ADMIN_DATABASE:-postgres}
      CONTENT_DATABASE_URL: postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}
      IDENTITY_DATABASE_URL: postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}
      WORKERS_DATABASE_URL: postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "migrate_all.py"]
    volumes:
      - ./postgres_migration:/app:z
    networks:
      - manifeed_internal
    restart: "no"

  edge_nginx:
    image: nginx:1.27-alpine
    container_name: manifeed_edge_nginx
    depends_on:
      public_api:
        condition: service_healthy
      worker_service:
        condition: service_started
      frontend_admin:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
      - ./nginx/fonts:/usr/share/nginx/html/fonts:ro
      - ./nginx/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manifeed_internal
      - traefik_proxy
    restart: unless-stopped

  public_api:
    image: manifeed_public_api:local
    build:
      context: ${PUBLIC_API_REPO_PATH:-../public_api}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_public_api
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      ALLOWED_HOSTS: ${PUBLIC_API_ALLOWED_HOSTS:-public_api,manifeed_public_api}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth_service:8000}
      AUTH_SERVICE_TIMEOUT_SECONDS: ${AUTH_SERVICE_TIMEOUT_SECONDS:-5}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user_service:8000}
      USER_SERVICE_TIMEOUT_SECONDS: ${USER_SERVICE_TIMEOUT_SECONDS:-5}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin_service:8000}
      ADMIN_SERVICE_TIMEOUT_SECONDS: ${ADMIN_SERVICE_TIMEOUT_SECONDS:-10}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://content_service:8000}
      CONTENT_SERVICE_TIMEOUT_SECONDS: ${CONTENT_SERVICE_TIMEOUT_SECONDS:-10}
      WORKER_SERVICE_URL: ${WORKER_SERVICE_URL:-http://worker_service:8000}
      WORKER_SERVICE_TIMEOUT_SECONDS: ${WORKER_SERVICE_TIMEOUT_SECONDS:-10}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      auth_service:
        condition: service_started
      user_service:
        condition: service_started
      admin_service:
        condition: service_started
      content_service:
        condition: service_started
      worker_service:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manifeed_internal
    restart: unless-stopped

  admin_service:
    image: manifeed_admin_service:local
    build:
      context: ${ADMIN_SERVICE_REPO_PATH:-../admin_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_admin_service
    user: "0:0"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTENT_READ_DATABASE_URL: ${CONTENT_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      CONTENT_WRITE_DATABASE_URL: ${CONTENT_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      IDENTITY_READ_DATABASE_URL: ${IDENTITY_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      IDENTITY_WRITE_DATABASE_URL: ${IDENTITY_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      WORKERS_READ_DATABASE_URL: ${WORKERS_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      WORKERS_WRITE_DATABASE_URL: ${WORKERS_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user_service:8000}
      USER_SERVICE_TIMEOUT_SECONDS: ${USER_SERVICE_TIMEOUT_SECONDS:-5}
      WORKER_SERVICE_URL: ${WORKER_SERVICE_URL:-http://worker_service:8000}
      WORKER_SERVICE_TIMEOUT_SECONDS: ${WORKER_SERVICE_TIMEOUT_SECONDS:-10}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-article_embeddings}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SOURCE_EMBEDDING_DIMENSIONS: ${SOURCE_EMBEDDING_DIMENSIONS:-1024}
      RSS_FEEDS_REPOSITORY_PATH: ${RSS_FEEDS_REPOSITORY_PATH:-/rss_feeds}
    depends_on:
      user_service:
        condition: service_started
      worker_service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready').read()\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - ${ADMIN_SERVICE_REPO_PATH:-../admin_service}:/app:z
      - ${RSS_FEEDS_HOST_PATH:-../../rss_feeds}:/rss_feeds:z
    networks:
      - manifeed_internal
    dns:
      - 8.8.8.8
    restart: unless-stopped

  content_service:
    image: manifeed_content_service:local
    build:
      context: ${CONTENT_SERVICE_REPO_PATH:-../content_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_content_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTENT_READ_DATABASE_URL: ${CONTENT_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-article_embeddings}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SOURCE_EMBEDDING_DIMENSIONS: ${SOURCE_EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the remote bge-m3_inference base URL}
      EMBEDDING_SERVICE_API_KEY: ${EMBEDDING_SERVICE_API_KEY:?Set EMBEDDING_SERVICE_API_KEY}
      SOURCE_SEARCH_RECENCY_HALFLIFE_DAYS: ${SOURCE_SEARCH_RECENCY_HALFLIFE_DAYS:-14}
      RSS_FEEDS_REPOSITORY_PATH: ${RSS_FEEDS_REPOSITORY_PATH:-/rss_feeds}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${CONTENT_SERVICE_REPO_PATH:-../content_service}:/app:z
      - ${RSS_FEEDS_HOST_PATH:-../../rss_feeds}:/rss_feeds:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - manifeed_internal
    dns:
      - 8.8.8.8
    restart: unless-stopped

  theme_classifier_service:
    image: manifeed_theme_classifier_service:local
    build:
      context: ${THEME_CLASSIFIER_SERVICE_REPO_PATH:-../theme_classifier_service}
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    container_name: manifeed_theme_classifier_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      THEME_SERVICE_API_KEY: ${THEME_SERVICE_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${THEME_CLASSIFIER_SERVICE_REPO_PATH:-../theme_classifier_service}:/app:z
    networks:
      - manifeed_internal
    restart: unless-stopped

  indexer_service:
    image: manifeed_indexer_service:local
    build:
      context: ${INDEXER_SERVICE_REPO_PATH:-../indexer_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_indexer_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTENT_READ_DATABASE_URL: ${CONTENT_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      CONTENT_WRITE_DATABASE_URL: ${CONTENT_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      WORKERS_READ_DATABASE_URL: ${WORKERS_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      WORKERS_WRITE_DATABASE_URL: ${WORKERS_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBEDDING_REDIS_QUEUE: ${EMBEDDING_REDIS_QUEUE:-embedding:source_embedding}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the remote bge-m3_inference base URL}
      EMBEDDING_SERVICE_API_KEY: ${EMBEDDING_SERVICE_API_KEY:?Set EMBEDDING_SERVICE_API_KEY}
      THEME_SERVICE_URL: ${THEME_SERVICE_URL:-http://theme_classifier_service:8000}
      THEME_SERVICE_API_KEY: ${THEME_SERVICE_API_KEY:-}
      NER_SERVICE_URL: ${NER_SERVICE_URL:?Set NER_SERVICE_URL to the remote ner_service base URL}
      NER_SERVICE_API_KEY: ${NER_SERVICE_API_KEY:?Set NER_SERVICE_API_KEY}
      PIPELINE_SERVICE_TIMEOUT_SECONDS: ${PIPELINE_SERVICE_TIMEOUT_SECONDS:-120}
      EMBEDDING_SERVICE_TIMEOUT_SECONDS: ${EMBEDDING_SERVICE_TIMEOUT_SECONDS:-300}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-article_embeddings}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SOURCE_EMBEDDING_DIMENSIONS: ${SOURCE_EMBEDDING_DIMENSIONS:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      theme_classifier_service:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INDEXER_SERVICE_REPO_PATH:-../indexer_service}:/app:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - manifeed_internal
    restart: unless-stopped

  worker_service:
    image: manifeed_worker_service:local
    build:
      context: ${WORKER_SERVICE_REPO_PATH:-../worker_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_worker_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTENT_READ_DATABASE_URL: ${CONTENT_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      CONTENT_WRITE_DATABASE_URL: ${CONTENT_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${CONTENT_POSTGRES_DB:-manifeed_content}}
      IDENTITY_READ_DATABASE_URL: ${IDENTITY_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      WORKERS_READ_DATABASE_URL: ${WORKERS_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      WORKERS_WRITE_DATABASE_URL: ${WORKERS_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${WORKERS_POSTGRES_DB:-manifeed_workers}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-article_embeddings}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SOURCE_EMBEDDING_DIMENSIONS: ${SOURCE_EMBEDDING_DIMENSIONS:-1024}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBEDDING_REDIS_QUEUE: ${EMBEDDING_REDIS_QUEUE:-embedding:source_embedding}
      SOURCE_EMBEDDING_BATCH_SIZE: ${SOURCE_EMBEDDING_BATCH_SIZE:-128}
      RSS_WORKER_GITHUB_REPOSITORY: ${RSS_WORKER_GITHUB_REPOSITORY:-Manifeed/workers}
      LANGUAGE_FASTTEXT_MODEL_PATH: ${LANGUAGE_FASTTEXT_MODEL_PATH:-/opt/models/lid.176.ftz}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${WORKER_SERVICE_REPO_PATH:-../worker_service}:/app:z
    networks:
      - manifeed_internal
    restart: unless-stopped

  auth_service:
    image: manifeed_auth_service:local
    build:
      context: ${AUTH_SERVICE_REPO_PATH:-../auth_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_auth_service
    environment:
      IDENTITY_READ_DATABASE_URL: ${IDENTITY_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      IDENTITY_WRITE_DATABASE_URL: ${IDENTITY_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      DB_POOL_SIZE: ${AUTH_SERVICE_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${AUTH_SERVICE_DB_MAX_OVERFLOW:-10}
      AUTH_SESSION_TOUCH_INTERVAL_SECONDS: ${AUTH_SESSION_TOUCH_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${AUTH_SERVICE_REPO_PATH:-../auth_service}:/app:z
    networks:
      - manifeed_internal
    restart: unless-stopped

  user_service:
    image: manifeed_user_service:local
    build:
      context: ${USER_SERVICE_REPO_PATH:-../user_service}
      dockerfile: Dockerfile
      additional_contexts:
        shared_backend_context: ${SHARED_BACKEND_REPO_PATH:-../shared_backend}
      provenance: false
      sbom: false
    container_name: manifeed_user_service
    environment:
      IDENTITY_READ_DATABASE_URL: ${IDENTITY_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      IDENTITY_WRITE_DATABASE_URL: ${IDENTITY_WRITE_DATABASE_URL:-postgresql://${POSTGRES_USER:-manifeed}:${POSTGRES_PASSWORD:-manifeed}@postgres:5432/${IDENTITY_POSTGRES_DB:-manifeed_identity}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${USER_SERVICE_REPO_PATH:-../user_service}:/app:z
    networks:
      - manifeed_internal
    restart: unless-stopped

  frontend_admin:
    image: manifeed_frontend_admin:local
    build:
      context: ${FRONTEND_REPO_PATH:-../frontend}
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    container_name: manifeed_frontend_admin
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL_ADMIN:-http://public_api:8000}
    depends_on:
      - public_api
    networks:
      - manifeed_internal
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:

networks:
  manifeed_internal:
    driver: bridge
  traefik_proxy:
    name: ${TRAEFIK_NETWORK_NAME:-traefik_proxy}
    external: true
